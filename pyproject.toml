[project]
name = "emporio-da-musica-agent"
version = "0.1.0"
description = "Customer-support chat agent for a musical instrument store (LLM tool calling, PT-BR)"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
emporio = "emporio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emporio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
